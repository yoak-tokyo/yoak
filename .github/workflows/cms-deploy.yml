# Notion（CMS）の内容をサイトに反映する。
# - 毎朝 5:00（JST）に自動実行
# - GitHub の Actions 画面の「Run workflow」から手動実行
#
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   NOTION_TOKEN                     Notion の読み取り用インテグレーションのトークン
#   CLOUDFLARE_API_TOKEN             Workers にデプロイできる API トークン
#   CLOUDFLARE_ACCOUNT_ID            Cloudflare のアカウント ID
# 必要な Variables:
#   NEXT_PUBLIC_TURNSTILE_SITE_KEY   Turnstile のサイトキー（公開して問題ない値）

name: Deploy CMS content

on:
  schedule:
    - cron: "0 20 * * *" # 毎日 20:00 UTC = 5:00 JST
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CMS_REQUIRED: "1"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
